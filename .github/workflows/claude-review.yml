# Fork-only workflow. Claude reviews every PR into minhash/main.

name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - minhash/main

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Use CLAUDE.md and the checklist in
            .claude/skills/review-minhash/SKILL.md. Check the change against the
            "Done when" list in the PR body.

            Report only correctness bugs, gaps against "Done when", and breaks of
            the repo rules. Do not report style that clang-tidy checks.

            Post an inline comment for each problem on a specific line. Then post
            one PR comment that starts with "## Verdict". It gives the number of
            Blocker, Major and Minor findings, and lists each finding under
            "### Findings" with its severity and file:line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
