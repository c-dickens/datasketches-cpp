# Fork-only workflow. It builds the MinHash demos in scripts/minhash/ and runs
# their unit tests. It downloads no data.

name: MinHash scripts

on:
  pull_request:
    branches:
      - minhash/main
  push:
    branches:
      - minhash/main
  workflow_dispatch:

jobs:
  build-and-test:
    name: scripts/minhash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S scripts/minhash -B scripts/minhash/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build scripts/minhash/build -j 4

      - name: Test
        run: ctest --test-dir scripts/minhash/build --output-on-failure
